<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Личный Блог</title>
    <link rel="stylesheet" href="style.css"> <!-- Мы используем тот же CSS или дополним его -->
<script src="https://counter.dev" data-id="halima-blog-2026" data-utcoffset="3"></script>

</head>
<body>

    <header>
        <h1>Добро пожаловать в мой блог! ✍️</h1>
        <p>Здесь я делюсь своими мыслями и успехами в IT.</p>
        <a href="index.html" class="btn">Назад на главную</a>
    </header>

    <main>
        <!-- Форма для добавления нового поста -->
        <section class="form-section">
            <h2>Добавить новую запись</h2>
            <form id="blog-form">
                <input type="text" id="post-title" placeholder="Заголовок статьи" required>
                <textarea id="post-text" placeholder="Текст вашей статьи..." rows="5" required></textarea>
                <button type="submit">Опубликовать</button>
            </form>
        </section>

        <!-- Лента, куда будут добавляться посты -->
        <section class="posts-section">
            <h2>Все записи</h2>
            <div id="posts-container">
                <!-- Сюда JavaScript будет вставлять наши посты -->
                <div class="post">
                    <h3>Мой первый пост!</h3>
                    <p>Привет! Сегодня я начала создавать свой личный блог. Это мой первый шаг в работе с динамическим JavaScript.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
