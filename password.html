
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Безопасных Паролей</title>
    <link rel="stylesheet" href="password-style.css">
</head>
<body>
    <div class="app">
        <h1>Генератор паролей</h1>

        <!-- Зона вывода пароля с полной поддержкой экранных дикторов -->
        <div class="out-box">
            <span id="pass" class="placeholder" aria-live="polite" aria-atomic="true">Нажмите «Сгенерировать»</span>
        </div>

        <div class="controls">
            <!-- Блок выбора длины пароля (инпут теперь правильно связан с текстом) -->
            <div class="range-info">
                <label for="len">Длина пароля: <b id="lenVal">12</b></label>
                <input id="len" type="range" min="6" max="32" value="12"/>
            </div>

            <!-- Блок чекбокса (текст теперь правильно связан с галочкой) -->
            <div class="chk-group">
                <label class="chk" for="sym">
                    <input id="sym" type="checkbox" checked/>
                    Включать спецсимволы (!@#%^&*)
                </label>
            </div>
        </div>

        <!-- Кнопки управления -->
        <div class="buttons-group">
            <button id="gen" class="btn-primary">Сгенерировать</button>
            <button id="copy" class="btn-secondary" disabled>Скопировать</button>
        </div>

        <!-- Дополнительное поле для уведомлений (например, "Пароль скопирован!") -->
        <p id="hint" class="hint" aria-live="polite"></p>
    </div>

    <script src="password-script.js"></script>
</body>
</html>
